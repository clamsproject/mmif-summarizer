
<html>

<head>
<link rel="stylesheet" href="main.css">
<script src="main.js"></script>
</head>

<body>

<h2>{{ title }}</h2>

<h3>Captions</h3>

<div class=section>
<table class=transcript>
{% for caption in captions %}
<tr valign="top">
  <td align=right>{{ caption.timepoint }}</td>
  <td>{{ caption.identifier }}</td>
  <td>{{ caption.text }}</td>
</tr>
{% endfor %}
</table>
</div>
