<html>

<head>
<link rel="stylesheet" href="main.css">
<script src="main.js"></script>
</head>

<body>

<h2>{{ summary.name }}</h2>

<h3>Transcript</h3>

<table class=transcript>
{% for line in summary.transcript %}
<tr valign="top">
  <td>{{ line.start }}</td>
  <td>{{ line.end }}</td>
  <td>{{ line.text }}</td>
</tr>
{% endfor %}
</table>

</body>
</html>
